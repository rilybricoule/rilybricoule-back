name: Backend CI

on:
  pull_request:
    branches: [ "develop" ]

jobs:
  build-test:
    name: Build & Test (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests
        run: mvn clean test

      - name: Package application
        run: mvn clean package -DskipTests

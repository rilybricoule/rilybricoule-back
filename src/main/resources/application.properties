# Application Configuration
spring.application.name=rilybricoule

# Database Configuration

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

google.maps.api.key=

# JWT Configuration
jwt.secret=dGVzdFNlY3JldEtleVRoYXRJc0F0TGVhc3QyNTZCaXRzTG9uZ0ZvckhTMjU2QWxnb3JpdGhtU2lnbmluZ0pXVDEyMzQ1Njc4OUtleQ==
jwt.expiration=86400000
jwt.refreshExpiration=604800000

server.port=8085

oauth2.google.client-id=YOUR_GOOGLE_CLIENT_ID
oauth2.facebook.app-id=YOUR_FACEBOOK_APP_ID
oauth2.facebook.app-secret=YOUR_FACEBOOK_APP_SECRET
oauth2.apple.client-id=YOUR_APPLE_CLIENT_ID

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true